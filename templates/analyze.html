<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyzed Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white min-h-screen">

    <div class="max-w-4xl mx-auto px-6 py-10">

        <h1 class="text-4xl font-bold mb-2">
            {{ purpose }}
        </h1>

        <p class="text-zinc-400 mb-8">
            Here's your processed text.
        </p>

        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 whitespace-pre-wrap break-words">
            {{ analyzed_text }}
        </div>

        <a href="/"
           class="inline-block mt-8 bg-indigo-600 hover:bg-indigo-700 transition px-6 py-3 rounded-xl font-semibold">
            ← Analyze Another Text
        </a>

    </div>

</body>
</html>
