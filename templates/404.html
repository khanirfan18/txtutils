<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center px-6">

    <div class="text-center max-w-3xl">

        <h1 class="text-8xl md:text-[12rem] font-black text-indigo-500 tracking-tight">
            404
        </h1>

        <h2 class="text-4xl md:text-5xl font-bold mt-2">
            Lost in the Void
        </h2>


        <p class="text-zinc-400 text-lg mt-6 leading-8">
            The page you're looking for doesn't exist, has been moved,
            or you may have typed the wrong URL :(
        </p>


        <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">

            <button onclick="history.back()"
                class="border border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900 px-8 py-3 rounded-xl font-semibold transition duration-200">
                Go Back
            </button>

        </div>
    </div>

</body>
</html>
